name: Run Updated C++ Projects

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2  # Fetch enough history to perform git diff

    - name: Get Changed Files with Python
      id: changed-files
      run: |
        python - <<EOF
        import os
        import subprocess
        
        # Get the list of changed files
        changed_files = subprocess.run(
            ["git", "diff", "--name-only", "HEAD^", "HEAD"],
            capture_output=True, text=True).stdout.strip().split("\n")

        print("Changed files:", changed_files)

        modified_dirs = set()
        for file in changed_files:
            parts = file.split('/')
            if len(parts) >= 4 and parts[0] == 'chapter_codes':
                project_path = f"{parts[0]}/{parts[1]}/{parts[2]}"
                modified_dirs.add(project_path)

        if modified_dirs:
            with open("modified_dirs.txt", "w") as f:
                f.write("\n".join(modified_dirs))
            print("Modified project directories:", modified_dirs)
        else:
            print("No relevant changes detected.")
            exit(0)
        EOF

    - name: Run Projects with Changes using Python
      run: |
        python - <<EOF
        import os

        if not os.path.exists("modified_dirs.txt"):
            print("No modified projects to process. Exiting...")
            exit(0)

        with open("modified_dirs.txt", "r") as f:
            project_dirs = [line.strip() for line in f if line.strip()]

        for project_dir in project_dirs:
            print(f"Running build in: {project_dir}")
            if os.path.isfile(f"{project_dir}/run.sh"):
                original_dir = os.getcwd()  # Save the current directory
                os.chdir(project_dir)  # Change to project directory
                os.system("chmod +x run.sh")
                os.system("bash run.sh")
                os.chdir(original_dir)  # Return to the original directory
                #os.system(f"chmod +x {project_dir}/run.sh")
                #os.system(f"bash {project_dir}/run.sh")
            else:
                print(f"run.sh not found in {project_dir}")
        EOF

    - name: Cleanup Build Directories
      run: |
        echo "Cleaning up build directories..."
        find chapter_codes -type d -name 'cmake-build-debug' -exec rm -rf {} +
