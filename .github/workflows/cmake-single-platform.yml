name: C++ Build and Test

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install CMake 3.30.0
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.30.0

      - name: Install other dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Find, process, and compile modified directories with .cpp files
        run: |
          # Print ASCII art
          echo " ░▒▓██████▓▒░ ░▒▓███████▓▒░      ░▒▓███████▓▒░░▒▓███████▓▒░░▒▓████████▓▒░░▒▓██████▓▒░  "
          echo "░▒▓█▓▒░░▒▓█▓▒░▒▓█▓▒░                    ░▒▓█▓▒░      ░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░ "
          echo "░▒▓█▓▒░      ░▒▓█▓▒░                    ░▒▓█▓▒░      ░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░ "
          echo "░▒▓█▓▒░       ░▒▓██████▓▒░        ░▒▓██████▓▒░░▒▓███████▓▒░░▒▓█▓▒░░▒▓█▓▒░░▒▓██████▓▒░  "
          echo "░▒▓█▓▒░             ░▒▓█▓▒░      ░▒▓█▓▒░             ░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░ "
          echo "░▒▓█▓▒░░▒▓█▓▒░      ░▒▓█▓▒░      ░▒▓█▓▒░             ░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░ "
          echo " ░▒▓██████▓▒░░▒▓███████▓▒░       ░▒▓████████▓▒░▒▓███████▓▒░░▒▓████████▓▒░░▒▓██████▓▒░  "

          # Initialize variables
          OUTPUT_MESSAGE=""
          ERROR_MESSAGE=""

          # Find all directories with changes that contain at least one .cpp file
          CHANGED_DIRS=$(git diff --name-only HEAD^ HEAD '*.cpp' | xargs -I {} dirname {} | sort | uniq)

          # Print header
          echo "Modified directories with .cpp files detected:"
          echo "$CHANGED_DIRS"

          # Loop through each directory and check for CMakeLists.txt
          for DIR in $CHANGED_DIRS; do
            if [[ -f "$DIR/CMakeLists.txt" ]]; then
              echo "Compiling project in directory: $DIR"

              # Remove existing build directory if it exists
              [[ -d "$DIR/cmake-build-debug" ]] && rm -rf "$DIR/cmake-build-debug"

              # Create build directory and compile the project
              mkdir -p "$DIR/cmake-build-debug"
              cmake -B "$DIR/cmake-build-debug" -S "$DIR"
              cmake --build "$DIR/cmake-build-debug"

              OUTPUT_MESSAGE+="----------------------------------------\n"
              OUTPUT_MESSAGE+="------------COMPILATION DONE------------\n"
              OUTPUT_MESSAGE+="----------------------------------------\n"

              # Get the project folder name
              PROJECT_NAME=$(basename "$DIR")
              OUTPUT_MESSAGE+="Project Name: $PROJECT_NAME\n"

              # Define build path
              BUILD_PATH="$DIR/cmake-build-debug"

              # Print build path and files
              OUTPUT_MESSAGE+="Build path: $BUILD_PATH\n"
              OUTPUT_MESSAGE+="Files in build path:\n"
              OUTPUT_MESSAGE+="$(ls -lah "$BUILD_PATH")\n"

              # Run the executable if it exists
              if [[ -f "$BUILD_PATH/$PROJECT_NAME" ]]; then
                OUTPUT_MESSAGE+=" ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░\n"
                OUTPUT_MESSAGE+="Running executable: $BUILD_PATH/$PROJECT_NAME\n"
                "$BUILD_PATH/$PROJECT_NAME"
                OUTPUT_MESSAGE+=" ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░\n"
              else
                ERROR_MESSAGE+=" ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░\n"
                ERROR_MESSAGE+="Error: Executable not found in $BUILD_PATH\n"
                ERROR_MESSAGE+=" ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░\n"
              fi
            else
              ERROR_MESSAGE+="Project Directory: \"$DIR\" does not contain CMakeLists.txt\n"
            fi
          done

          # Print final output
          echo -e "$OUTPUT_MESSAGE"

          # Print error messages
          if [[ -n "$ERROR_MESSAGE" ]]; then
            echo "----------------------------------------"
            echo "The following projects must include a CMakeLists.txt file:"
            echo -e "$ERROR_MESSAGE"
          fi