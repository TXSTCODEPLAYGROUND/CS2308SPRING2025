name: Run Updated C++ Projects

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Get Changed Files
      id: changed-files
      run: |
        CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
        echo "Changed files: $CHANGED_FILES"

        # Find the unique folders that contain run.sh within chapter_codes/somefolder/
        MODIFIED_DIRS=$(echo "$CHANGED_FILES" | grep 'chapter_codes/somefolder/.*/.*/' | awk -F'/' '{print $1"/"$2"/"$3"/"$4}' | sort -u)
        echo "Modified project directories: $MODIFIED_DIRS"

        # Save directories to be used in next steps
        echo "$MODIFIED_DIRS" > modified_dirs.txt

    - name: Run Projects with Changes
      run: |
        while IFS= read -r project_dir; do
          echo "Running build in: $project_dir"
          cd "$project_dir"
          if [[ -f run.sh ]]; then
            chmod +x run.sh
            ./run.sh
          else
            echo "run.sh not found in $project_dir"
          fi
          cd - > /dev/null
        done < modified_dirs.txt

    - name: Cleanup Build Directories
      run: |
        echo "Cleaning up build directories..."
        find chapter_codes -type d -name 'cmake-build-debug' -exec rm -rf {} +
