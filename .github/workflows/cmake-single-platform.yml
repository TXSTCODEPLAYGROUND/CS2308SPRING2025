name: C++ Build and Test

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install CMake 3.30.0
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.30.0

      - name: Install other dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Find, print, and build modified projects
        run: |
          echo "Starting build process for modified projects..."
          # Print ASCII art
          echo " ░▒▓██████▓▒░ ░▒▓███████▓▒░      ░▒▓███████▓▒░░▒▓███████▓▒░░▒▓████████▓▒░░▒▓██████▓▒░  "
          echo "░▒▓█▓▒░░▒▓█▓▒░▒▓█▓▒░                    ░▒▓█▓▒░      ░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░ "
          echo "░▒▓█▓▒░      ░▒▓█▓▒░                    ░▒▓█▓▒░      ░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░ "
          echo "░▒▓█▓▒░       ░▒▓██████▓▒░        ░▒▓██████▓▒░░▒▓███████▓▒░░▒▓█▓▒░░▒▓█▓▒░░▒▓██████▓▒░  "
          echo "░▒▓█▓▒░             ░▒▓█▓▒░      ░▒▓█▓▒░             ░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░ "
          echo "░▒▓█▓▒░░▒▓█▓▒░      ░▒▓█▓▒░      ░▒▓█▓▒░             ░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░ "
          echo " ░▒▓██████▓▒░░▒▓███████▓▒░       ░▒▓████████▓▒░▒▓███████▓▒░░▒▓████████▓▒░░▒▓██████▓▒░  "

          # Flag to track if any project was affected
          AFFECTED=0

          echo "Scanning for projects that contain at least one .cpp file and were modified..."

          # Use find with -print0 to handle directory names with spaces.
          while IFS= read -r -d '' PROJECT_DIR; do
            # Check if the directory contains at least one .cpp file (recursively)
            if find "$PROJECT_DIR" -type f -name "*.cpp" | grep -q .; then
              # Only process this project if any file in it was modified in the latest commit
              if ! git diff --quiet HEAD^ HEAD -- "$PROJECT_DIR"; then
                AFFECTED=1
                echo "----------------------------------------"
                echo "Processing project: $PROJECT_DIR"
                
                # Check if CMakeLists.txt exists in the project directory
                if [ -f "$PROJECT_DIR/CMakeLists.txt" ]; then
                  BUILD_DIR="$PROJECT_DIR/cmake-build-debug"
                  
                  # Remove the existing build directory if it exists
                  if [ -d "$BUILD_DIR" ]; then
                    echo "Removing existing build directory: $BUILD_DIR"
                    rm -rf "$BUILD_DIR"
                  fi

                  # Create a new build directory and configure the project
                  echo "Creating build directory and configuring project..."
                  mkdir -p "$BUILD_DIR"
                  cmake -B "$BUILD_DIR" -S "$PROJECT_DIR"
                  
                  # Build the project
                  echo "Building project..."
                  cmake --build "$BUILD_DIR"

                  echo "Compilation complete for project: $PROJECT_DIR"
                  
                  # Retrieve and print the project name
                  PROJECT_NAME=$(basename "$PROJECT_DIR")
                  echo "Project Name: $PROJECT_NAME"

                  # List files in the build directory
                  echo "Build path: $BUILD_DIR"
                  echo "Files in build path:"
                  ls -lah "$BUILD_DIR"

                  # Attempt to run the executable if it exists
                  if [ -f "$BUILD_DIR/$PROJECT_NAME" ]; then
                    echo "Running executable: $BUILD_DIR/$PROJECT_NAME"
                    "$BUILD_DIR/$PROJECT_NAME"
                  else
                    echo "Error: Executable '$PROJECT_NAME' not found in $BUILD_DIR"
                  fi
                else
                  echo "Error: CMakeLists.txt not found in $PROJECT_DIR. Skipping build for this project."
                fi
              fi
            fi
          done < <(find . -mindepth 3 -maxdepth 3 -type d -print0)

          if [ $AFFECTED -eq 0 ]; then
            echo "No modified projects detected."
          fi