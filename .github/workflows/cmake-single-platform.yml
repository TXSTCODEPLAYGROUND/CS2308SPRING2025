name: C++ Build and Test

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install CMake 3.30.0
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.30.0

      - name: Install other dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Find, print, and build modified CMake projects
        run: |
          # Print ASCII art
          echo " ░▒▓██████▓▒░ ░▒▓███████▓▒░      ░▒▓███████▓▒░░▒▓███████▓▒░░▒▓████████▓▒░░▒▓██████▓▒░  "
          echo "░▒▓█▓▒░░▒▓█▓▒░▒▓█▓▒░                    ░▒▓█▓▒░      ░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░ "
          echo "░▒▓█▓▒░      ░▒▓█▓▒░                    ░▒▓█▓▒░      ░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░ "
          echo "░▒▓█▓▒░       ░▒▓██████▓▒░        ░▒▓██████▓▒░░▒▓███████▓▒░░▒▓█▓▒░░▒▓█▓▒░░▒▓██████▓▒░  "
          echo "░▒▓█▓▒░             ░▒▓█▓▒░      ░▒▓█▓▒░             ░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░ "
          echo "░▒▓█▓▒░░▒▓█▓▒░      ░▒▓█▓▒░      ░▒▓█▓▒░             ░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░▒▓█▓▒░░▒▓█▓▒░ "
          echo " ░▒▓██████▓▒░░▒▓███████▓▒░       ░▒▓████████▓▒░▒▓███████▓▒░░▒▓████████▓▒░░▒▓██████▓▒░  "

          # Find all directories containing CMakeLists.txt
          PROJECT_DIRS=$(find . -name CMakeLists.txt -exec dirname {} \;)

          # Print header
          echo "Modified directories with changes detected:"

          # Loop through each directory and check for changes
          for PROJECT_DIR in $PROJECT_DIRS; do
            # Check if there are any changes in the directory
            if ! git diff --quiet HEAD^ HEAD -- "$PROJECT_DIR"; then
              echo "- $PROJECT_DIR"

              # Remove existing build directory if it exists
              [[ -d "$PROJECT_DIR/cmake-build-debug" ]] && rm -rf "$PROJECT_DIR/cmake-build-debug"

              # Create build directory and compile the project
              mkdir -p "$PROJECT_DIR/cmake-build-debug"
              cmake -B "$PROJECT_DIR/cmake-build-debug" -S "$PROJECT_DIR"
              cmake --build "$PROJECT_DIR/cmake-build-debug"

              echo "----------------------------------------"
              echo "------------COMPILATION DONE------------"
              echo "----------------------------------------"

              # Get the project folder name
              PROJECT_NAME=$(basename "$PROJECT_DIR")
              echo "Project Name: $PROJECT_NAME"

              # Define build path
              BUILD_PATH="$PROJECT_DIR/cmake-build-debug"

              # Print build path and files
              echo "Build path: $BUILD_PATH"
              echo "Files in build path:"
              ls -lah "$BUILD_PATH"

              # Run the executable if it exists
              if [[ -f "$BUILD_PATH/$PROJECT_NAME" ]]; then
                echo " ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░"
                echo "Running executable: $BUILD_PATH/$PROJECT_NAME"
                "$BUILD_PATH/$PROJECT_NAME"
                echo " ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░"
              else
                echo " ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░"
                echo "Error: Executable not found in $BUILD_PATH"
                echo " ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░"
                exit 1
              fi
            fi
          done